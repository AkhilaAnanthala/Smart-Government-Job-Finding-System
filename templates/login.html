{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="container">
    <div class="card card-portal card-static auth-card">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 text-brand mb-1"><i class="bi bi-box-arrow-in-right"></i> Log in</h1>
        <p class="text-muted">Welcome back! Enter your details to continue.</p>

        <form method="post" action="{{ url_for('login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="next" value="{{ next_url }}">

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ email }}"
                   maxlength="254" autocomplete="email" autofocus required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" name="password"
                     maxlength="128" autocomplete="current-password" required>
              <button class="btn btn-outline-secondary" type="button" data-toggle-password="#password" aria-label="Show or hide password">
                <i class="bi bi-eye"></i></button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100">Log in</button>
        </form>

        <p class="text-center mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
