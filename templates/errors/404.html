{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div class="display-1 text-brand"><i class="bi bi-compass"></i></div>
  <h1 class="h2 mt-3">Page not found (404)</h1>
  <p class="text-muted">The page you are looking for does not exist or has been moved.</p>
  <a class="btn btn-primary" href="{{ safe_url('index', '/') }}">Go to Home</a>
</div>
{% endblock %}
