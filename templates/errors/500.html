{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div class="display-1 text-warning"><i class="bi bi-exclamation-triangle"></i></div>
  <h1 class="h2 mt-3">Something went wrong (500)</h1>
  <p class="text-muted">An unexpected error occurred. Please try again in a moment.</p>
  <a class="btn btn-primary" href="{{ safe_url('index', '/') }}">Go to Home</a>
</div>
{% endblock %}
