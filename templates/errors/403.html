{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div class="display-1 text-danger"><i class="bi bi-shield-lock"></i></div>
  <h1 class="h2 mt-3">Access denied (403)</h1>
  <p class="text-muted">You do not have permission to open this page.</p>
  <a class="btn btn-primary" href="{{ safe_url('index', '/') }}">Go to Home</a>
</div>
{% endblock %}
