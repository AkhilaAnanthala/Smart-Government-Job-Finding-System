{# Needs: pager_endpoint, page, pages, args #}
{% if pages > 1 %}
<nav aria-label="Pages" class="mt-4">
  <ul class="pagination justify-content-center flex-wrap">
    <li class="page-item {{ 'disabled' if page <= 1 }}">
      <a class="page-link" href="{{ url_for(pager_endpoint, page=page - 1, **args) if page > 1 else '#' }}">Previous</a>
    </li>
    {% for p in range(1, pages + 1) %}
    <li class="page-item {{ 'active' if p == page }}">
      <a class="page-link" href="{{ url_for(pager_endpoint, page=p, **args) }}">{{ p }}</a>
    </li>
    {% endfor %}
    <li class="page-item {{ 'disabled' if page >= pages }}">
      <a class="page-link" href="{{ url_for(pager_endpoint, page=page + 1, **args) if page < pages else '#' }}">Next</a>
    </li>
  </ul>
</nav>
{% endif %}
